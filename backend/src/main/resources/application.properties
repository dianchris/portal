server.port=${PORTAL_PORT:8080}
server.address=${PORTAL_BIND:127.0.0.1}
server.error.include-message=never
portal.backstage-url=${BACKSTAGE_URL:http://127.0.0.1:8091}
portal.backstage-token=${BACKSTAGE_TOKEN}
portal.username=${PORTAL_USERNAME:partner}
portal.password=${PORTAL_PASSWORD}
portal.organization=${PORTAL_ORGANIZATION:demo-partner}
portal.sandbox-username=${PORTAL_SANDBOX_USERNAME:partner-sandbox}
portal.sandbox-password=${PORTAL_SANDBOX_PASSWORD:}

spring.datasource.url=${PORTAL_DATABASE_URL:jdbc:postgresql://localhost:5432/portal}
spring.datasource.username=${PORTAL_DATABASE_USER:portal}
spring.datasource.password=${PORTAL_DATABASE_PASSWORD}
portal.registration-token=${PORTAL_REGISTRATION_TOKEN}
portal.invitation-key=${PORTAL_INVITATION_KEY}
portal.public-url=${PORTAL_PUBLIC_URL:http://localhost:3000}
